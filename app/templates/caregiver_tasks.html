{% extends "base.html" %}
{% block title %}今日任務{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='task_today.css') }}">
{% endblock %}

{% block body %}
<div class="task-page">

  <h1>今日任務</h1>

  <div id="card">
    <div>你的任務</div>

    <div id="taskText">載入中…</div>

    <div class="action-row">
      <button id="doneBtn">我完成了</button>
      <span id="status"></span>
    </div>

    <div class="hint">
      ※ 需要失智者按「確認完成」，才會算真正完成
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
  const taskText = document.getElementById("taskText");
  const doneBtn = document.getElementById("doneBtn");
  const statusEl = document.getElementById("status");

  function formatTime(isoStr) {
    if (!isoStr) return null;
    
    // 把 T 換成空格，確保瀏覽器乖乖當成本地時間解析
    const cleanStr = String(isoStr).replace('T', ' ');
    const d = new Date(cleanStr);
    if (isNaN(d)) return null;

    const abs = d.toLocaleString("zh-TW", {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    });
    
    // 🌟 核心修正：直接把現在時間減去任務時間，不要再加減 8 小時了
    const diff = Date.now() - d.getTime();
    
    const mins  = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days  = Math.floor(diff / 86400000);

    let rel;
    if (diff < 0 || mins < 1) rel = "剛剛"; // 加上 diff < 0 防呆
    else if (mins < 60)  rel = `${mins} 分鐘前`;
    else if (hours < 24) rel = `${hours} 小時前`;
    else if (days === 1) rel = "昨天";
    else                 rel = `${days} 天前`;

    return { rel, abs };
  }

  async function gateRole() {
    const r = await fetch("/api/patient/today_status");
    const s = await r.json();

    if (!r.ok) {
      taskText.textContent = "讀取失敗";
      statusEl.textContent = s.error || r.status;
      doneBtn.disabled = true;
      return false;
    }

    if (s.role !== "caregiver") {
      location.href = "/patient/farm";
      return false;
    }

    return true;
  }

  async function load() {
    const r = await fetch("/api/tasks/today");
    const j = await r.json();

    if (!r.ok) {
      taskText.textContent = "讀取失敗";
      statusEl.textContent = j.error || r.status;
      doneBtn.disabled = true;
      return;
    }

    taskText.textContent = j.task_text || "今天尚未指派任務（請稍後再試）";

    if (j.completed) {
      doneBtn.disabled = true;
      const t1 = formatTime(j.caregiver_done_at);
      const t2 = formatTime(j.patient_confirmed_at);
      statusEl.innerHTML =
    `✅ 已完成`+ (t1 ? ` <span style="color:#999;font-size:12px;" title="${t1.abs}">家屬完成 ${t1.rel}</span>` : "")
    + (t2 ? ` <span style="color:#999;font-size:12px;" title="${t2.abs}">｜失智者確認 ${t2.rel}</span>` : "");

      } else if (j.caregiver_done && !j.patient_confirmed) {
        doneBtn.disabled = true;
        const t1 = formatTime(j.caregiver_done_at);
        statusEl.innerHTML =
          `已送出，等待失智者確認…`
          + (t1 ? ` <span style="color:#999;font-size:12px;" title="${t1.abs}">${t1.rel}</span>` : "");

      } else {
        doneBtn.disabled = false;
        statusEl.textContent = "";
      }
  }

  doneBtn.addEventListener("click", async () => {
    doneBtn.disabled = true;
    statusEl.textContent = "送出中…";

    const r = await fetch("/api/tasks/complete", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({})
    });

    const j = await r.json();

    if (!r.ok) {
      statusEl.textContent = "失敗：" + (j.error || r.status);
      doneBtn.disabled = false;
      return;
    }

    showCoinsPopup(j.coins_earned || 5, j.coins_total);
    statusEl.textContent = "已送出，等待確認…";
    await load();
  });

  (async () => {
    const ok = await gateRole();
    if (!ok) return;
    await load();
    setInterval(load, 10000);
  })();

  function showCoinsPopup(earned, total) {
    const el = document.createElement("div");
    el.style.cssText = `
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8);
      background:white; border-radius:20px; padding:28px 36px; z-index:9999;
      box-shadow:0 8px 32px rgba(0,0,0,0.2); text-align:center;
      animation: popIn 0.3s ease forwards;
    `;
    el.innerHTML = `
      <div style="font-size:48px;">🪙</div>
      <div style="font-size:22px; font-weight:800; margin-top:8px;">+${earned} 金幣！</div>
      ${total !== undefined ? `<div style="color:#888; font-size:14px; margin-top:4px;">目前共 ${total} 枚</div>` : ""}
    `;
    const style = document.createElement("style");
    style.textContent = `@keyframes popIn { from { opacity:0; transform:translate(-50%,-50%) scale(0.7); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }`;
    document.head.appendChild(style);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  }
</script>
{% endblock %}
